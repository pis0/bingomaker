name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr_diff.txt
          head -c 100000 pr_diff.txt > pr_diff_trimmed.txt

      - name: AI Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DIFF=$(cat pr_diff_trimmed.txt)

          SYSTEM_MSG="You are a senior code reviewer. Review the following pull request diff. Focus on: 1) Bugs or logic errors 2) Security vulnerabilities 3) Performance issues 4) Code clarity and maintainability. Be concise and actionable. If the code looks good, say so briefly. Do not nitpick style. Respond in Portuguese (Brazilian)."

          USER_MSG=$(printf "## PR: %s\n\n%s\n\n## Diff:\n\`\`\`diff\n%s\n\`\`\`" "$PR_TITLE" "$PR_BODY" "$DIFF")

          PAYLOAD=$(jq -n \
            --arg model "gpt-4o" \
            --arg system "$SYSTEM_MSG" \
            --arg user "$USER_MSG" \
            '{
              model: $model,
              messages: [
                { role: "system", content: $system },
                { role: "user", content: $user }
              ],
              temperature: 0.3
            }')

          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$PAYLOAD")

          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "Review failed — check API response."')

          COMMENT=$(printf "## AI Code Review (gpt-4o)\n\n%s" "$REVIEW")
          gh pr comment "$PR_NUMBER" --body "$COMMENT"
